<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Agent V1.5</title><style>body{font-family:system-ui;max-width:900px;margin:auto;padding:20px;background:#f4f5f7}section{background:white;padding:20px;margin:15px 0;border-radius:18px}input{width:100%;box-sizing:border-box;padding:14px;border-radius:12px;border:1px solid #ccc}button{margin-top:12px;padding:12px 18px;border:0;border-radius:12px}.r{border-top:1px solid #ddd;padding:14px 0}</style></head><body><h1>🤖 Opportunity Hunter V1.5</h1><section><h2>Research objective</h2><input id="q" value="digital product opportunities Etsy planner tracker printable"><button onclick="go()">Research</button><p id="s"></p></section><section><h2>Results</h2><div id="o">No research yet.</div></section><script>const esc=x=>String(x||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));async function go(){let q=document.getElementById('q').value.trim(),s=document.getElementById('s'),o=document.getElementById('o');s.textContent='Searching…';try{let r=await fetch('/api/research?q='+encodeURIComponent(q)),d=await r.json();if(d.error)throw Error(d.error);s.textContent='Research complete.';o.innerHTML=d.results.length?d.results.map(x=>`<div class="r"><b>Score: ${x.score}/100</b><h3>${esc(x.title)}</h3><p>${esc(x.snippet)}</p><small>${x.reasons.map(esc).join(' ')}</small><br><a href="${esc(x.url)}" target="_blank">Open source</a></div>`).join(''):'No results.'}catch(e){s.textContent='Error: '+e.message;o.textContent='Make sure server.py is running in Termux.'}}</script></body></html>
